workflows:
  shell-gjilan-ios-unsigned:
    name: Shell Gjilan iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Release without signing
        script: |
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        script: |
          rm -rf build/ios/unsigned
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          /usr/bin/zip -qry ShellGjilan.ipa Payload

    artifacts:
      - build/ios/unsigned/ShellGjilan.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
